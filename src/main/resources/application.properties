spring.application.name=oficina-billing-service
server.port=8081

# Os valores padrão abaixo servem apenas para desenvolvimento local
# (docker-compose do repositório oficina-infra-k8s).
# Em outros ambientes, sobrescreva via variáveis de ambiente,
# ex.: SPRING_DATASOURCE_PASSWORD, SPRING_RABBITMQ_PASSWORD.

# Banco de dados (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/oficina_billing?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:admin_password}
spring.jpa.hibernate.ddl-auto=update

# Mensageria (RabbitMQ)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin_password}

# Retry dos consumidores: 3 tentativas com espera crescente (1s, 2s).
# Esgotadas as tentativas, a mensagem vai para a DLQ do serviço (ver RabbitMQConfig).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10s

# Mercado Pago: NUNCA coloque o token aqui. Defina as variáveis de ambiente
# MERCADOPAGO_ACCESS_TOKEN e MERCADOPAGO_NOTIFICATION_URL (URL pública do serviço,
# usada pelo Mercado Pago para chamar o webhook /billing/webhook).
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}

# Observabilidade
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
